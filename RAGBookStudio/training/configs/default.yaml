base_model: BAAI/bge-small-en-v1.5

chunk_tokens: 256
chunk_overlap_tokens: 32
min_chunk_tokens: 32
max_chunk_tokens: 512

queries_per_chunk: 4
hard_negatives_per_query: 3
bm25_negatives: 2
embedding_negatives: 2

epochs: 3
batch_size: 16
grad_accum_steps: 2
learning_rate: 2.0e-5
warmup_ratio: 0.1
weight_decay: 0.01
max_seq_length: 512
evaluation_steps: 100
save_steps: 200
early_stopping_patience: 3
seed: 42

max_public_samples: 5000
# Folder that contains one or more .zip files (PDFs inside each zip are used)
zip_folder: ""
# Example Colab:
# zip_folder: "/content/drive/MyDrive/NCERT_Zips"

train_ratio: 0.85
val_ratio: 0.10

export_onnx: true
model_name: ragbook-bge-small-ncert
